[project]
name = "tendril"
version = "0.1.0"
description = "A tiny self-tending knowledge graph prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tendril = "tendril.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tendril"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
